site_name: SharePoint Admin Labs
site_description: Laboratori pratici SharePoint Online per amministratori
site_author: Alessandro Lapi
site_url: https://cvn-computergross.github.io/SharePoint-Admin/
repo_name: SharePoint-Admin
repo_url: https://github.com/cvn-computergross/SharePoint-Admin
copyright: Collaboration Value Next · Computer Gross

theme:
  name: material
  language: it
  custom_dir: overrides
  logo: assets/img/edulabs-cvn.png
  icon:
    repo: fontawesome/brands/github
  favicon: assets/img/edulabs_blu_nocgross.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - toc.follow
    - navigation.top
    - content.code.copy

extra_javascript:
  - javascripts/checklist.js
  - javascripts/nav-collapsed.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tasklist: { custom_checkbox: true, clickable_checkbox: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


plugins: []   # nessuna ricerca

# La navigazione (nav) viene generata da scripts/build_docs.py a partire dal branch main.
